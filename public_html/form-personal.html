<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulário de cadastro </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">


</head>
<body class="d-flex align-items-center">

    <div class="container">
        <div class="row">
            <div class="col-md-6 image-wrapper">
                <img src="./img/tela.pessoal.svg" class="img-fluid">

            </div>
            <div class="col-md-6 p-5">

                <h3 class="py-3">Cadastre-se</h3>

                <form action="/" method="post">

                    <div class="row">

                        <div class="form-group col-sm-6">
                            <label for="Firstname" class="form-label">Primeiro nome:</label>
                            <input id="Firstname" type="text" name="Firstname" placeholder="digite seu primeiro nome" class="form-control" required>
                        </div>

                        <div class="form-group col-sm-6">
                            <label for="lastname" class="form-label">Sobrenome</label>
                            <input id="lastname" type="text" name="lastname" placeholder="digite seu sobrenome" class="form-control" required>
                        </div>

                        <div class="form-group col-sm-6">
                            <label for="email" class="form-label">E-mail</label>
                            <input id="email" type="email" name="email" placeholder="digite seu email" class="form-control" required>
                        </div>

                        <div class="form-group col-sm-6">
                            <label for="tel" class="form-label">Telefone</label>
                            <input id="tel" type="number" name="tel" placeholder="(xx) xxxx-xxxx" class="form-control" required>
                        </div>

                        <div class="form-group col-sm-6">
                            <label for="cep" class="form-label">CEP</label>
                            <input id="cep" type="number" name="cep" placeholder="(xx) xxxx-xxxx" class="form-control" required>
                        </div>


                        <div class="form-group col-sm-6">
                            <label for="date" class="form-label">Data de Nascimento</label>
                            <input id="date" type="date" name="date" class="form-control" required>
                        </div>

                        <div class="form-group col-sm-6">
                            <label for="password" class="form-label">Senha</label>
                            <input id="password" type="password" name="password" placeholder="digite sua senha" class="form-control" required>
                        </div>

                        <div class="form-group col-sm-6">
                            <label for="Confirmpassword" class="form-label">Confirme sua senha</label>
                            <input id="Confirmpassword" type="password" name="Confirmpassword" placeholder="Confirme sua senha" class="form-control" required>
                        </div>



                    </div>

                    <div>
                        <div class="form-label">Gênero</div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
                            <label class="form-check-label" for="inlineRadio1">Feminino</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                            <label class="form-check-label" for="inlineRadio2">masculino</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio3" value="option3">
                            <label class="form-check-label" for="inlineRadio3">Outros</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio4" value="option4">
                            <label class="form-check-label" for="inlineRadio4">Prefiro não dizer</label>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <button onclick="javascript:history.back()" class="btn btn-outline-primary">Voltar</button>
                        <button class="btn btn-primary">Continuar</button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
