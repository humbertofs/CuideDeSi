<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>formulário de cadastro profissional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">


</head>
<body class="d-flex align-items-center">

    <div class="container">
        <div class="row">
            <div class="col-md-6 image-wrapper">
                <img src="./img/tela.profissional.svg" class="img-fluid">

            </div>
            <div class="col-md-6 p-5">

                <h3 class="py-3">Dados de Profissional</h3>

                <form action="/" method="post">

                    <div class="row">

                        <div class="form-group col-sm-12">
                            <label for="Foto" class="form-label">Coloque uma foto sua:</label>
                            <input id="Foto" type="file" name="Foto" class="form-control" required>
                        </div>

                        <div class="form-group col-sm-12">
                            <label for="biografia" class="form-label">Fale sobre você</label>
                            <textarea id="biografia" name="biografia" placeholder="Fale um pouco sobre suas experiências, como você trabalha, etc..." class="form-control"></textarea>
                        </div>

                        <div class="form-group col-sm-6">
                            <label for="text" class="form-label">Área de atuação</label>
                            <input id="text" type="text" name="text" placeholder="digite seu email" class="form-control" required>
                        </div>

                        <div class="form-group col-sm-6">
                            <label for="text" class="form-label">Especialização</label>
                            <input id="text" type="text" name="text" placeholder="digite seu email" class="form-control" required>
                        </div>

                        <div class="form-group col-sm-6">
                            <label for="text" class="form-label">Registro Profissional</label>
                            <input id="text" type="text" name="text" placeholder="digite seu email" class="form-control" required>
                        </div>

                        <div class="form-group col-sm-6">
                            <label for="Disponibilidade" class="form-label">Disponibilidade</label>
                            <input id="Disponibilidade" type="text" name="Disponibilidade" placeholder="coloque seus dias disponíveis" 
                            class="form-control" required>
                        </div>



                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <button onclick="javascript:history.back()" class="btn btn-outline-primary">Voltar</button>
                        <button class="btn btn-primary">Continuar</button>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
